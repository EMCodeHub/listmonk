name: listmonk-production

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_LISTMONK_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    shm_size: 256mb
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  listmonk:
    image: listmonk/listmonk:v5.1.0
    restart: unless-stopped
    env_file: .env
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:9000:9000"
    entrypoint: ["/opt/listmonk/entrypoint.sh"]
    volumes:
      - ./entrypoint.sh:/opt/listmonk/entrypoint.sh:ro
      - ./config.toml:/listmonk/config.toml:ro
      - listmonk_uploads:/listmonk/uploads
    depends_on:
      postgres: {condition: service_healthy}
    networks: [backend, frontend]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9000/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "10"}

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      PGPASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    entrypoint: ["/bin/sh", "/opt/backup/backup-loop.sh"]
    volumes:
      - ./backup-loop.sh:/opt/backup/backup-loop.sh:ro
      - ./backups:/backups
    depends_on:
      postgres: {condition: service_healthy}
    networks: [backend]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}

secrets:
  postgres_password:
    file: ./secrets/postgres_password

volumes:
  postgres_data:
  listmonk_uploads:

networks:
  backend:
    internal: true
  frontend:
